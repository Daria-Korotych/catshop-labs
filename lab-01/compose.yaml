name: catshop-lab01
services:
  app:
    build: .
    image: catshop:lab01
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # `db` resolves because Compose puts both services on one network.
      DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD}@db:5432/shop
      # The partner's base URL is configuration, so a stub can stand in for the real API.
      PARTNER_URL: http://partner:8080
      PARTNER_TIMEOUT: "2"
    depends_on:
      db:
        condition: service_healthy
    # The only service on more than one network, so the only path between the outside, the db and the partner.
    networks: [frontend, backend, partnernet]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  # Stand-in for the third-party API: WireMock replays ./partner/mappings.
  partner:
    image: wiremock/wiremock:3.6.0
    command: ["--verbose", "--disable-banner"]
    volumes:
      - ./partner/mappings:/home/wiremock/mappings:ro
    networks: [partnernet]

volumes:
  pgdata:

networks:
  frontend:
  # internal: true removes the gateway, so the db can reach the app and nothing else.
  backend:
    internal: true
  partnernet:
    internal: true
